name: Build & Release

on:
  push:
    branches:
      - protonvpn-next-dev
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Telethon
        run: pip install telethon

      - name: Decode Google Services
        run: echo "${{ secrets.GOOGLE_SERVICES_BASE64 }}" | base64 -d > app/google-services.json
        continue-on-error: true

      - name: Decode Signing Key
        run: |
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > app/release.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build All Variants
        run: ./gradlew assemble
        env:
          SIGNING_KEY_FILE: release.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Notify & Upload to Telegram (Telethon)
        if: always()
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BUILD_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          python - <<EOF
          import os
          import asyncio
          from telethon import TelegramClient

          async def main():
              api_id_str = os.environ.get('TG_API_ID')
              api_hash = os.environ.get('TG_API_HASH')
              bot_token = os.environ.get('TG_BOT_TOKEN')
              chat_id_str = os.environ.get('TG_CHAT_ID')
              status = os.environ.get('BUILD_STATUS', 'UNKNOWN').upper()
              
              if not all([api_id_str, api_hash, bot_token, chat_id_str]):
                  print("Missing Telegram secrets. Skipping notification.")
                  return

              api_id = int(api_id_str)
              chat_id = int(chat_id_str)
              
              client = TelegramClient('bot', api_id, api_hash)
              await client.start(bot_token=bot_token)
              
              async with client:
                  # 1. Send Status Message
                  message = f"🔨 Build {status}: {os.environ.get('REPO')} ({os.environ.get('REF')})"
                  await client.send_message(chat_id, message)
                  
                  # 2. Upload APKs if Success
                  if status == "SUCCESS":
                      for root, dirs, files in os.walk("app/build/outputs/apk/"):
                          for file in files:
                              if file.endswith(".apk"):
                                  path = os.path.join(root, file)
                                  print(f"Uploading {path}...")
                                  await client.send_file(chat_id, path)

          if __name__ == '__main__':
              asyncio.run(main())
          EOF

      - name: Generate Changelog
        if: success() && startsWith(github.ref, 'refs/tags/')
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 ${GITHUB_REF_NAME}^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
            git log --pretty=format:"* %s (%h)" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
            git log ${PREVIOUS_TAG}..${GITHUB_REF_NAME} --pretty=format:"* %s (%h)" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Determine Release Type
        if: success() && startsWith(github.ref, 'refs/tags/')
        id: release_type
        run: |
          TAG_NAME=${GITHUB_REF_NAME}
          if [[ $TAG_NAME =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            echo "PRERELEASE=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Release (GitHub)
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.CHANGELOG }}
          prerelease: ${{ steps.release_type.outputs.PRERELEASE == 'true' }}
          files: app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
