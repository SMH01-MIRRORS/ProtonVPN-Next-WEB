when:
  - event: push
    branch: protonvpn-next-dev
  - event: tag
  - event: manual

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0

steps:
  build-android:
    image: ghcr.io/cirruslabs/android-sdk:36
    environment:
      ANDROID_HOME: /opt/android-sdk-linux
      SIGNING_KEY_BASE64:
        from_secret: SIGNING_KEY_BASE64
      SIGNING_STORE_PASSWORD:
        from_secret: SIGNING_STORE_PASSWORD
      SIGNING_KEY_ALIAS:
        from_secret: SIGNING_KEY_ALIAS
      SIGNING_KEY_PASSWORD:
        from_secret: SIGNING_KEY_PASSWORD
      SENTRY_AUTH_TOKEN:
        from_secret: SENTRY_AUTH_TOKEN
      SENTRY_ORG:
        from_secret: SENTRY_ORG
      SENTRY_PROJECT:
        from_secret: SENTRY_PROJECT
    commands:
      - git fetch --unshallow || true
      - git fetch --tags
      - echo "Current commit count: $(git rev-list --count HEAD)"
      - echo $SIGNING_KEY_BASE64 | base64 -d > app/release.keystore
      - chmod +x gradlew
      - export SIGNING_KEY_FILE=release.keystore
      - ./gradlew assembleDebug assembleRelease

  generate-changelog:
    image: alpine/git
    when:
      event: tag
    commands:
      - git fetch --tags
      - "git log -1 --pretty=format:\"%s%n%n🏷️ Tag: ${CI_COMMIT_TAG}%n🔢 Commit: %h\" > changelog.txt"

  publish-release:
    image: woodpeckerci/plugin-release
    when:
      event: tag
    settings:
      api_key:
        from_secret: CODEBERG_TOKEN
      files:
        - app/build/outputs/apk/release/*.apk
      note: changelog.txt
      title: "Release ${CI_COMMIT_TAG}"

  upload-telegram:
    image: python:3.11-slim
    environment:
      TG_API_ID:
        from_secret: TG_API_ID
      TG_API_HASH:
        from_secret: TG_API_HASH
      TG_BOT_TOKEN:
        from_secret: TG_BOT_TOKEN
      TG_CHAT_ID:
        from_secret: TG_CHAT_ID
    commands:
      - pip install telethon
      - python scripts/upload_telegram.py
