when:
  - event: push
    branch: protonvpn-next-dev
  - event: tag
  - event: manual

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0

steps:
  build-android:
    image: ghcr.io/cirruslabs/android-sdk:36
    environment:
      ANDROID_HOME: /opt/android-sdk-linux
      SIGNING_KEY_BASE64:
        from_secret: SIGNING_KEY_BASE64
      SIGNING_STORE_PASSWORD:
        from_secret: SIGNING_STORE_PASSWORD
      SIGNING_KEY_ALIAS:
        from_secret: SIGNING_KEY_ALIAS
      SIGNING_KEY_PASSWORD:
        from_secret: SIGNING_KEY_PASSWORD
      SENTRY_AUTH_TOKEN:
        from_secret: SENTRY_AUTH_TOKEN
      SENTRY_ORG:
        from_secret: SENTRY_ORG
      SENTRY_PROJECT:
        from_secret: SENTRY_PROJECT
    commands:
      # 1. Force update sdkmanager and install Android 37.0
      - yes | sdkmanager --licenses > /dev/null
      - sdkmanager --update
      - sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      # 2. Prepare Git metadata
      - git fetch --unshallow || true
      - git fetch --tags
      - 'echo "Current commit count: $(git rev-list --count HEAD)"'

      # 3. Setup Keystore
      - echo $SIGNING_KEY_BASE64 | base64 -d > app/release.keystore
      - chmod +x gradlew
      - export SIGNING_KEY_FILE=release.keystore

      # 4. Build APKs based on flavor
      - |
        if [ -n "$CI_COMMIT_TAG" ]; then
          ./gradlew assembleStableRelease
        else
          ./gradlew assembleNightlyDebug assembleNightlyRelease
        fi

  generate-changelog:
    image: alpine/git
    when:
      event: tag
    commands:
      - git fetch --tags
      - "git log -1 --pretty=format:\"%s%n%n🏷️ Tag: ${CI_COMMIT_TAG}%n🔢 Commit: %h\" > changelog.txt"

  publish-release:
    image: woodpeckerci/plugin-release
    when:
      event: tag
      # Используем фильтр по названию тега: только цифры и точки
      ref: refs/tags/[0-9]*.[0-9]*.[0-9]* 
    settings:
      api_key:
        from_secret: CODEBERG_TOKEN
      files:
        - app/build/outputs/apk/stable/release/*.apk
      note: changelog.txt
      title: "Release ${CI_COMMIT_TAG}"
      prerelease: false

  publish-pre-release:
    image: woodpeckerci/plugin-release
    when:
      event: tag
      # Любой тег, который НЕ попал под первое правило (содержит буквы)
      ref: 
        exclude: refs/tags/[0-9]*.[0-9]*.[0-9]*
    settings:
      api_key:
        from_secret: CODEBERG_TOKEN
      files:
        - app/build/outputs/apk/stable/release/*.apk
      note: changelog.txt
      title: "Pre-release ${CI_COMMIT_TAG}"
      prerelease: true

  publish-release-github:
    image: plugins/github-release
    when:
      event: tag
      ref: refs/tags/[0-9]*.[0-9]*.[0-9]*
    settings:
      api_key:
        from_secret: GITHUB_TOKEN
      files:
        - app/build/outputs/apk/stable/release/*.apk
      note: changelog.txt
      title: "Release ${CI_COMMIT_TAG}"
      base_url: https://github.com
      repository: SMH01-MIRRORS/ProtonVPN-Next-MIRROR

  publish-pre-release-github:
    image: plugins/github-release
    when:
      event: tag
      ref:
        exclude: refs/tags/[0-9]*.[0-9]*.[0-9]*
    settings:
      api_key:
        from_secret: GITHUB_TOKEN
      files:
        - app/build/outputs/apk/stable/release/*.apk
      note: changelog.txt
      title: "Pre-release ${CI_COMMIT_TAG}"
      prerelease: true
      base_url: https://github.com
      repository: SMH01-MIRRORS/ProtonVPN-Next-MIRROR

  publish-ota:
    image: python:3.11-slim
    environment:
      R2_ACCESS_KEY:
        from_secret: R2_ACCESS_KEY
      R2_SECRET_KEY:
        from_secret: R2_SECRET_KEY
      R2_ENDPOINT:
        from_secret: R2_ENDPOINT
      R2_BUCKET:
        from_secret: R2_BUCKET
      R2_PUBLIC_URL:
        from_secret: R2_PUBLIC_URL
      CODEBERG_TOKEN:
        from_secret: CODEBERG_TOKEN
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
    commands:
      - apt-get update && apt-get install -y git
      - pip install boto3
      - python scripts/publish_ota.py

  upload-telegram:
    image: python:3.11-slim
    environment:
      TG_API_ID:
        from_secret: TG_API_ID
      TG_API_HASH:
        from_secret: TG_API_HASH
      TG_BOT_TOKEN:
        from_secret: TG_BOT_TOKEN
      TG_CHAT_ID:
        from_secret: TG_CHAT_ID
    commands:
      - pip install telethon
      - python scripts/upload_telegram.py