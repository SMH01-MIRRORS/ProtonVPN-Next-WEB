[versions]
agp = "9.2.1"
kotlin = "2.3.21"
ksp = "2.3.2"
hilt = "2.59.2"
room = "2.8.4"
roomKsp = "2.8.4"
sentry = "6.7.1"
sentryAndroid = "8.41.0"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
collectionsImmutable = "0.4.0"
activityCompose = "1.13.0"
datastore = "1.2.1"
work = "2.11.2"
androidSvg = "1.4"
composeBom = "2026.05.01"
navigationCompose = "2.9.8"
hiltNavigationCompose = "1.3.0"
hiltLifecycleCompose = "1.3.0"
hiltWork = "1.3.0"
okhttp = "5.3.2"
retrofit = "3.0.0"
retrofitSerialization = "1.0.0"
serializationJson = "1.11.0"
amneziawg = "2.3.7"
leakcanary = "2.14"
junit = "4.13.2"
mockito = "5.23.0"
mockitoKotlin = "6.3.0"
coroutinesTest = "1.11.0"
mockwebserver = "5.3.2"
androidxJunit = "1.3.0"
espressoCore = "3.7.0"
material = "1.14.0"
goVpnLib = "0.1.87"
composeMaterial3 = "1.5.0-alpha20"
graphicsShapes = "1.1.0"
graphicsPath = "1.1.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
android-svg = { module = "com.caverock:androidsvg-aar", version.ref = "androidSvg" }

# Compose
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "composeMaterial3" }
androidx-compose-material3-window-size = { group = "androidx.compose.material3", name = "material3-window-size-class", version.ref = "composeMaterial3" }
androidx-compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltLifecycleCompose" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltWork" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltWork" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomKsp" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "roomKsp" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomKsp" }

# Network & Serialization
okhttp-dnsoverhttps = { group = "com.squareup.okhttp3", name = "okhttp-dnsoverhttps", version.ref = "okhttp" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization-converter = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerialization" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "collectionsImmutable" }

# VPN Protocols
amneziawg-android = { group = "com.zaneschepke", name = "amneziawg-android", version.ref = "amneziawg" }
go-vpn-lib = { module = "me.proton.vpn:go-vpn-lib", version.ref = "goVpnLib" }

# Sentry
sentry-android = { group = "io.sentry", name = "sentry-android", version.ref = "sentryAndroid" }
sentry-compose = { group = "io.sentry", name = "sentry-compose-android", version.ref = "sentryAndroid" }
sentry-okhttp = { group = "io.sentry", name = "sentry-okhttp", version.ref = "sentryAndroid" }
sentry-replay = { group = "io.sentry", name = "sentry-android-replay", version.ref = "sentryAndroid" }

# Debug
leakcanary-android = { group = "com.squareup.leakcanary", name = "leakcanary-android", version.ref = "leakcanary" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version.ref = "mockitoKotlin" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockwebserver" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphicsShapes" }
androidx-graphics-path = { group = "androidx.graphics", name = "graphics-path", version.ref = "graphicsPath" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
sentry = { id = "io.sentry.android.gradle", version.ref = "sentry" }
